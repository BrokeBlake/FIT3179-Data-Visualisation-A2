<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Comptible" content="IE_edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.17.0"></script>
    <script src="vega_java_variables.js"></script>


    <style>

        body
        {
            margin: 0px;
            padding: 20px;
            height: 200px;
            background-image: url("https://raw.githubusercontent.com/BrokeBlake/FIT3179-Data-Visualisation-A2/main/data/city_sketch_background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1
        {
            margin-bottom: 40px;
        }
        .primary-container
        {
            display: block;
            max-width: 1080px;
            margin: 10px auto 40px auto;
            background-color: green;
            padding: 2px;
            border-radius: 5px;
        }

        .horizontal-container
        {
            display: flex;
            max-width: 1080px;
            margin: 2px;
            background-color: blue;
            padding: 2px;
            border-radius: 5px;
            gap: 2px;
        }

        .horizontal-small
        {
            display: block;
            flex: 40%;
            margin: 0px;
            background-color: orange;
            padding: 10px;
            border-radius: 5px;
        }
        
        .horizontal-large
        {
            display: block;
            flex: 60%;
            margin: 0px;
            background-color: orange;
            padding: 10px;
            border-radius: 5px;
        }


        .left-align-text
        {
            flex: 1;
            display: block;
            background-color: yellow;
            text-align: left;
            font-size: 16px;
            padding: 10px;
            border-radius: 5px;
            margin: 10px;
        }
        .right-align-text
        {
            flex: 1;
            display: block;
            background-color: yellow;
            text-align: right;
            font-size: 16px;
            padding: 10px;
            border-radius: 5px;
            margin: 10px;
        }
        .centre-align-text
        {
            flex: 1;
            display: block;
            background-color: yellow;
            text-align: center;
            font-size: 16px;
            padding: 10px;
            border-radius: 5px;
            margin: 10px;
        }

        

        
    </style>
</head>

<body>
    <div class="primary-container">
        <div class="horizontal-container">
            <div class="centre-align-text">
                <p>
                    Text here
                    <br><br>
                    And here
                </p>
            </div>
            
        </div>
        <div class="horizontal-container">
            <div class="horizontal-large">
                <p>
                    More Text
                </p>
            </div>
            <div class="horizontal-small"></div>
        </div>

        <div class="horizontal-container">
            <div class="horizontal-small"></div>
            <div class="horizontal-small"></div>
        </div>
        
    </div>


    <div class="primary-container">
        <div class="horizontal-container">
            <div class="horizontal-small">
                <div class="centre-align-text">
                    <p>
                        Text here
                        <br><br>
                        And here
                    </p>
                </div>
                <div class="centre-align-text">
                    <p>
                        Text here
                        <br><br>
                        And here
                    </p>
                </div>
            </div>
            <div class="horizontal-large"></div>
        </div>
    </div>


    <div class="primary-container">

    </div>


    <div class="primary-container">

    </div>


</body>


</html>
